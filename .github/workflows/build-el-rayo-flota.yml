name: Build APK MIRIAN FLOTA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/build-el-rayo-flota.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar proyecto EL RAYO FLOTA
        env:
          PROJECT_ARCHIVE_B64: ""
        run: |
          python - <<'PYBUILD'
          import os,base64,io,zipfile
          zipfile.ZipFile(io.BytesIO(base64.b64decode(os.environ['PROJECT_ARCHIVE_B64']))).extractall('android-src')
          PYBUILD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configurar Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        working-directory: android-src/el-rayo-flota-android
        run: gradle assembleDebug
      - name: Preparar APK
        run: cp android-src/el-rayo-flota-android/app/build/outputs/apk/debug/app-debug.apk EL-RAYO-FLOTA.apk
      - name: Subir APK instalable
        uses: actions/upload-artifact@v4
        with:
          name: EL-RAYO-FLOTA
          path: EL-RAYO-FLOTA.apk
